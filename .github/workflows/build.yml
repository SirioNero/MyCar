name: Build

# Compiles the debug app and runs the unit tests on every push, so a change that doesn't build
# shows up at once. The APK is kept as an artifact, to install on the phone and try in the car.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MyCar-debug-${{ github.sha }}
          path: build/MyCar-debug.apk
          if-no-files-found: error
