name: Car preview

# Runs the car UI in an Android emulator through the debug-only CarPreviewActivity and pushes the
# screenshots to the ci/car-preview branch (replaced on every run), so a change to the car screen
# can be looked at without a car - and from environments that can fetch git but not artifacts.
on:
  push:
    branches: ["design/**"]
  workflow_dispatch:
    inputs:
      shots:
        description: "Only these shots, by name, space-separated (all when empty)"
        required: false
        default: ""

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the debug app
        run: ./gradlew :app:assembleDebug --no-daemon

      # Car apps to try myCar with, from their latest releases: Vela Maps (navigation), Plancia
      # (Home Assistant; its debug build, the one that accepts any car screen) and Xonos (Music
      # Assistant). One that fails to download is just left out of the shots.
      - name: Download car apps to try
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p third-party
          get() { curl -fsSL -o "third-party/$1" "$2" || { echo "could not download $1"; rm -f "third-party/$1"; }; }
          get plancia.apk https://github.com/SirioNero/Home-Assistant-on-Gearslip/releases/latest/download/Plancia-debug.apk
          get xonos.apk https://github.com/SirioNero/Music-Assistant-on-Gearslip/releases/latest/download/Xonos.apk
          # Vela's APK names change between releases: take the newest release that has one, and
          # among its APKs an x86_64 or universal build if there is one.
          apks=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/PimpinPumpkin/Vela/releases?per_page=10" |
            jq -r '[.[] | select(any(.assets[]; .name | endswith(".apk")))][0].assets[] | select(.name | endswith(".apk")) | .browser_download_url' || true)
          echo "Vela APKs: $apks"
          vela=$(grep -i -m1 'x86_64' <<< "$apks" || grep -i -m1 'universal' <<< "$apks" || head -n1 <<< "$apks")
          [ -n "$vela" ] && get vela.apk "$vela"
          ls -l third-party

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Render the car screen
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ONLY: ${{ inputs.shots }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash .github/car-preview.sh

      - name: Publish to the ci/car-preview branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd previews
          printf '# Car preview\n\nCommit %s on %s.\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > README.md
          git init -q -b ci/car-preview
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Car preview of ${GITHUB_SHA::7} ($GITHUB_REF_NAME)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/car-preview
